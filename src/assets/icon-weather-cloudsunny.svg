<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>구름 조금 낀 해 아이콘 (135도)</title>
<!-- 
    Sunny with Clouds Icon (Clouds at 135 degrees)
    - Style: Minimalist design, consistent with the existing set.
    - Colors: Red for the sun (#FF6B6B), Greys for clouds (#BDBDBD, #D3D3D3).
    - Composition: Clouds positioned so their center is at a 135-degree angle clockwise from the top-center of the sun.
-->
<g id="SunnyWithClouds">
    <!-- 태양 (배경) -->
    <g id="Sun">
        <circle cx="32" cy="32" r="10" fill="#FF6B6B"/>
        <g id="Rays" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round">
            <line x1="32" y1="14" x2="32" y2="18"/>
            <line x1="32" y1="46" x2="32" y2="50"/>
            <line x1="50" y1="32" x2="46" y2="32"/>
            <line x1="18" y1="32" x2="14" y2="32"/>
            <line x1="44.2" y1="19.8" x2="41.4" y2="22.6"/>
            <line x1="22.6" y1="41.4" x2="19.8" y2="44.2"/>
            <line x1="44.2" y1="44.2" x2="41.4" y2="41.4"/>
            <line x1="22.6" y1="22.6" x2="19.8" y2="19.8"/>
        </g>
    </g>
    
    <!-- 구름 (전경) - 135도 각도로 우측 하단에 위치 -->
    <g id="Clouds" transform="translate(26, 26)">
        <!-- 뒷배경 구름 -->
        <path d="M40.7,46 H18.2 c-4.4,0-8-3.6-8-8 c0-4.1,3.1-7.5,7.1-7.9 c1.1-5.3,5.9-9.1,11.5-9.1 c5.5,0,10.2,3.8,11.5,8.9 c0.1,0,0.1,0,0.2,0 c3.9,0,7,3.1,7,7 C46.7,43.5,44.1,46,40.7,46z" fill="#BDBDBD" transform="scale(0.75) translate(-10, -10)"/>
        <!-- 전경 구름 -->
        <path d="M48.2,38 H25.7 c-4.4,0-8-3.6-8-8 c0-4.1,3.1-7.5,7.1-7.9 c1.1-5.3,5.9-9.1,11.5-9.1 c6.5,0,11.7,5.2,11.7,11.7 c0,0.1,0,0.2,0,0.3 c3.8,0.2,6.8,3.4,6.8,7.2 C55.2,34.9,52.1,38,48.2,38z" fill="#D3D3D3" transform="scale(0.75) translate(-20, -15)"/>
    </g>
</g>
</svg>
