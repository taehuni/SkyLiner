<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>뇌우 아이콘</title>
<!-- 
    Thunderstorm Icon
    - Style: Minimalist design to match the existing icon set.
    - Colors: Greys for clouds (#BDBDBD, #D3D3D3), Blue for rain (#A0C4E4), Yellow for lightning (#FFC107).
    - Composition: Two overlapping clouds with rain and a lightning bolt.
-->
<g id="Thunderstorm">
    <!-- 구름 -->
    <g id="Clouds">
        <!-- 뒷배경 구름 -->
        <path d="M43.7,38H21.2c-4.4,0-8-3.6-8-8c0-4.1,3.1-7.5,7.1-7.9c1.1-5.3,5.9-9.1,11.5-9.1c5.5,0,10.2,3.8,11.5,8.9c0.1,0,0.1,0,0.2,0c3.9,0,7,3.1,7,7C49.7,35.5,47.1,38,43.7,38z" fill="#BDBDBD"/>
        <!-- 전경 구름 -->
        <path d="M48.2,32H25.7c-4.4,0-8-3.6-8-8c0-4.1,3.1-7.5,7.1-7.9c1.1-5.3,5.9-9.1,11.5-9.1c6.5,0,11.7,5.2,11.7,11.7c0,0.1,0,0.2,0,0.3c3.8,0.2,6.8,3.4,6.8,7.2C55.2,28.9,52.1,32,48.2,32z" fill="#D3D3D3"/>
    </g>
    <!-- 빗방울 -->
    <g id="Rain">
        <line x1="24" y1="42" x2="20" y2="50" stroke="#A0C4E4" stroke-width="3" stroke-linecap="round"/>
        <line x1="32" y1="42" x2="28" y2="50" stroke="#A0C4E4" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- 번개 -->
    <g id="Lightning">
        <path d="M44 39 L38 47 L43 47 L36 56" stroke="#FFC107" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
</g>
</svg>
