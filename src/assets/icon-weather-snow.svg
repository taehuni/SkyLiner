<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>흩날리는 눈 아이콘</title>
<!-- 
    Light Snow Icon
    - Style: Minimalist, consistent with the existing icon set.
    - Color: A light, icy blue (#A0D2EB) for the snowflakes.
    - Composition: Three simple geometric snowflakes of varying sizes and rotations to depict a light snowfall.
-->
<g id="Snowflakes">
    <!-- 눈송이 모양 정의 -->
    <defs>
        <g id="snowflake-shape" stroke="#A0D2EB" stroke-width="2.5" stroke-linecap="round">
            <line x1="0" y1="-10" x2="0" y2="10"/>
            <line x1="-8.66" y1="-5" x2="8.66" y2="5"/>
            <line x1="-8.66" y1="5" x2="8.66" y2="-5"/>
        </g>
    </defs>
    
    <!-- 눈송이 배치 -->
    <!-- 큰 눈송이 (중앙 좌측) -->
    <use href="#snowflake-shape" transform="translate(26 32) scale(1.2) rotate(15)"/>
    
    <!-- 중간 눈송이 (우측 하단) -->
    <use href="#snowflake-shape" transform="translate(45 48) scale(0.9) rotate(-10)"/>
    
    <!-- 작은 눈송이 (우측 상단) -->
    <use href="#snowflake-shape" transform="translate(50 18) scale(0.7) rotate(30)"/>
</g>
</svg>
