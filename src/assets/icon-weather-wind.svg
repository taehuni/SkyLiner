<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<title>바람과 나뭇잎 아이콘</title>
<!-- 
    Windy Day Icon with Green Leaf
    - Style: Minimalist design, consistent with the existing set.
    - Colors: Blue for wind gusts (#A0C4E4), Green for the leaf (#8BC34A), Dark Green for the vein (#689F38).
    - Composition: Abstract wind lines blowing a single, clearly defined leaf.
-->
<g id="WindyGreenLeaf">
    <!-- 바람 -->
    <g id="Wind">
        <path d="M12 24 C 24 18, 36 26, 48 22" stroke="#A0C4E4" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M10 34 C 22 28, 38 38, 54 34" stroke="#A0C4E4" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M14 44 C 26 38, 34 48, 46 44" stroke="#A0C4E4" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    <!-- 나뭇잎 -->
    <g id="Leaf" transform="rotate(30 52 40)">
        <!-- Leaf Shape -->
        <path d="M52 32 C 47 34, 48 41, 51 45 C 54 49, 59 48, 61 44 C 63 40, 57 34, 52 32 Z" fill="#8BC34A"/>
        <!-- Leaf Vein -->
        <path d="M52.5 33 C 54 38, 54 42, 53 47" stroke="#689F38" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    </g>
</g>
</svg>
